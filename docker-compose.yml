services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legalintel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legalintel"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: uvicorn legalintel.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://legal:legal@db:5432/legalintel
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./results:/app/results:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
